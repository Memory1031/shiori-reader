name: Release iOS

# iOS 签名发布：推送 v* 标签时构建签名 IPA 并上传 App Store Connect（TestFlight）。
# 签名材料为 App Store Connect API 密钥 + Apple Distribution 证书（p12），全部存为
# repository secrets。API 仅复用 / 创建 App Store profiles，不创建证书。
# 手动入口仅做签名构建冒烟，不上传 ASC；公开仓库的 Actions 产物任何登录用户都可
# 下载，因此不在工作流中生成分发证书（其产物含未加密私钥）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 必须与 .fvmrc 和 pubspec.yaml 的 Flutter 约束保持一致
  FLUTTER_VERSION: 3.38.10
  # pubspec.lock 记录此镜像；源地址不同也会导致严格锁定校验失败。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  ios-release:
    name: iOS 签名构建并上传 TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 选择 Xcode 26.3 并检查上传 SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::App Store Connect 要求 iOS 26 SDK 或更高版本。"
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      # 与 Android 共用的 tag / pubspec 版本一致性预检；手动冒烟无标签上下文，跳过。
      - name: 版本一致性检查
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tool/release_android.py version

      - name: 检查签名材料
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ] || [ -z "$CERT" ]; then
            echo "::error::缺少 ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / IOS_DIST_CERT_P12 / IOS_DIST_CERT_PASSWORD；发布流程见 docs/ci.md。"
            exit 1
          fi

      # 证书导入临时钥匙串并解锁，否则 macOS runner 上签名步骤会挂起。
      - name: 导入签名证书
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: 写入 App Store Connect API 密钥
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      # 版本号不在此处修改：发版时人工对齐 pubspec version / build number 与 tag
      # （ASC 要求同一 versionName 下 CFBundleVersion 严格递增）。
      - name: 准备工程配置与 Pods
        run: |
          flutter build ios --config-only --no-codesign --no-pub
          cd ios && pod install

      # 只在 runner 的工作副本中覆盖 Release 签名设置；两个 target 的 profile 各自匹配。
      - name: 准备手动分发签名并核对有效设置
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          security find-identity -v -p codesigning
          python3 ../tool/ios_release_signing.py

      - name: 构建 archive（手动分发签名）
        working-directory: ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/ios/Shiori.xcarchive \
            archive

      - name: 导出 IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath ../build/ios/Shiori.xcarchive \
            -exportOptionsPlist ../build/ios/ExportOptions.plist \
            -exportPath ../build/ios/ipa

      # 上传仅限 tag 发布；手动触发止步于签名构建冒烟，不触碰 App Store Connect。
      - name: 上传 TestFlight
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
