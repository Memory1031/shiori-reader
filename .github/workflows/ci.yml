name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须与 .fvmrc 和 pubspec.yaml 的 Flutter 约束保持一致
  FLUTTER_VERSION: 3.38.4
  # 三份 pubspec.lock 都记录此镜像；源地址不同也会导致严格锁定校验失败。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  analyze-test:
    name: 格式、静态分析与离线测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:version:-:arch:-${{ hashFiles('pubspec.lock', 'tools/source_probe/pubspec.lock', 'tool/db_codegen/pubspec.lock') }}"

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      # 根目录 analyze 会扫描嵌套包，必须先生成调查包自己的 package_config。
      - name: 安装调查包依赖
        working-directory: tools/source_probe
        run: dart pub get --enforce-lockfile

      - name: 安装数据库生成器依赖
        working-directory: tool/db_codegen
        run: dart pub get --enforce-lockfile

      - name: 检查工作流与锁文件
        run: |
          dart tool/check_ci_yaml.dart
          git diff --exit-code -- pubspec.lock tools/source_probe/pubspec.lock tool/db_codegen/pubspec.lock

      - name: 检查数据库生成代码
        run: |
          bash tool/generate_database.sh
          git diff --exit-code -- tool/db_codegen/pubspec.lock lib/data/local/database
          test -z "$(git ls-files --others --exclude-standard lib/data/local/database)"

      - name: 检查本地化生成代码
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          test -z "$(git ls-files --others --exclude-standard lib/l10n/generated)"

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态分析
        run: flutter analyze --no-pub

      - name: 单元与组件测试
        run: flutter test --no-pub

      - name: 调查包格式检查
        working-directory: tools/source_probe
        run: dart format --output=none --set-exit-if-changed bin lib test

      - name: 调查包静态分析
        working-directory: tools/source_probe
        run: dart --suppress-analytics analyze

      - name: 调查样本离线校验
        working-directory: tools/source_probe
        # 先输出预检报告，避免样本损坏只表现为多项测试的连带失败。
        # 默认不请求源站，不传 --live。
        run: dart bin/source_probe.dart

      - name: 调查包离线测试
        working-directory: tools/source_probe
        run: dart --suppress-analytics test --reporter expanded

  android-build:
    name: Android Debug 与 Release smoke
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:version:-:arch:-${{ hashFiles('pubspec.lock', 'tools/source_probe/pubspec.lock', 'tool/db_codegen/pubspec.lock') }}"

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 检查构建边界
        run: |
          git diff --exit-code -- pubspec.lock
          test ! -e android/key.properties

      - name: 构建 debug APK
        shell: bash
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          flutter build apk --debug --no-pub 2>&1 | tee build/ci-logs/android-debug.log

      # main 上的合并 / 推送及手动运行才检查 release，PR 不重复编译。
      # 无发布 secrets，沿用项目的 debug 签名回退；不是正式候选包。
      - name: 构建 release smoke APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee build/ci-logs/android-release.log

      - name: 检查构建后的锁文件与生成代码
        run: |
          git diff --exit-code -- pubspec.lock lib/l10n/generated lib/data/local/database
          test -z "$(git ls-files --others --exclude-standard lib/l10n/generated lib/data/local/database)"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Release smoke 产物
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v4
        with:
          name: app-release-smoke-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: 保留构建日志（包括失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
