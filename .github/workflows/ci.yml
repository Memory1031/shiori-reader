name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须与 .fvmrc 和 pubspec.yaml 的 Flutter 约束保持一致
  FLUTTER_VERSION: 3.38.4
  # 三份 pubspec.lock 都记录此镜像；源地址不同也会导致严格锁定校验失败。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  quality:
    name: 格式、静态分析与生成一致性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:version:-:arch:-${{ hashFiles('pubspec.lock', 'tools/source_probe/pubspec.lock', 'tool/db_codegen/pubspec.lock') }}"

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      # 根目录 analyze 会扫描嵌套包，必须先生成调查包自己的 package_config。
      - name: 安装调查包依赖
        working-directory: tools/source_probe
        run: dart pub get --enforce-lockfile

      - name: 安装数据库生成器依赖
        working-directory: tool/db_codegen
        run: dart pub get --enforce-lockfile

      - name: 检查工作流与锁文件
        run: |
          dart tool/check_ci_yaml.dart
          git diff --exit-code -- pubspec.lock tools/source_probe/pubspec.lock tool/db_codegen/pubspec.lock

      - name: 检查数据库生成代码
        run: |
          bash tool/generate_database.sh
          git diff --exit-code -- tool/db_codegen/pubspec.lock lib/data/local/database
          test -z "$(git ls-files --others --exclude-standard lib/data/local/database)"

      - name: 检查本地化生成代码
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          test -z "$(git ls-files --others --exclude-standard lib/l10n/generated)"

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态分析
        run: flutter analyze --no-pub

      - name: 调查包格式检查
        working-directory: tools/source_probe
        run: dart format --output=none --set-exit-if-changed bin lib test

      - name: 调查包静态分析
        working-directory: tools/source_probe
        run: dart --suppress-analytics analyze

      - name: 调查样本离线校验
        working-directory: tools/source_probe
        # 先输出预检报告，避免样本损坏只表现为多项测试的连带失败。
        # 默认不请求源站，不传 --live。
        run: dart bin/source_probe.dart

  windows-build:
    name: Windows x64 Release 构建
    # 固定 VS 2022 工具链；WebView 0.6.x 的 /await 不兼容 VS 2026。
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # WebView fork 是多平台仓库，检出和 Pub 的 Git 子进程都需要长路径。
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}"

      - name: 检查 Windows 构建工具
        run: |
          Get-Command nuget -ErrorAction Stop | Select-Object Source
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ($LASTEXITCODE -ne 0 -or !$vsVersion -or ([version]$vsVersion).Major -ne 17) {
            throw 'Windows build requires Visual Studio 2022 with C++ tools'
          }
          flutter doctor -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 严格安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 检查锁文件
        run: git diff --exit-code -- pubspec.lock

      - name: 构建 Windows Release
        run: flutter build windows --release --no-pub --target lib/main.dart

      - name: 检查运行目录
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($relative in @('shiori.exe', 'flutter_windows.dll', 'flutter_inappwebview_windows_plugin.dll', 'data/app.so', 'data/icudtl.dat', 'data/flutter_assets/AssetManifest.bin')) {
            $file = Join-Path $bundle $relative
            if (!(Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Missing or empty Windows runtime file: $relative"
            }
          }

      - name: 手动验收 Windows ZIP
        if: github.event_name == 'workflow_dispatch'
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)\+').Matches.Groups[1].Value
          ./tool/package_windows.ps1 -Tag "v$version" -Commit $env:GITHUB_SHA

      - name: 保存手动验收 ZIP
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-zip-check-${{ github.sha }}
          path: build/windows-release-assets/
          if-no-files-found: error
          retention-days: 7
