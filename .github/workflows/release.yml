name: Release

# 正式发布工作流：仅在推送 v* 标签时触发。日常质量检查由 ci.yml 负责，
# Android 与 Windows 并行构建后统一发布；完整检查由 develop CI 独立执行。
# 对外公开分发前需完成 docs/release/dependencies.md 中的渠道 / 许可核对。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # 同一标签的多次运行不互相取消，避免 Release 写一半被中断。
  cancel-in-progress: false

env:
  # 必须与 .fvmrc 和 pubspec.yaml 的 Flutter 约束保持一致
  FLUTTER_VERSION: 3.38.4
  # 三份 pubspec.lock 都记录此镜像；源地址不同也会导致严格锁定校验失败。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  android-release:
    name: Android 签名发布构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 预检固定版本的 APK 校验工具
        # runner 已预装 35.0.0；不依赖未加入 PATH 的 sdkmanager。
        run: python3 tool/release_android.py tools

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:version:-:arch:-${{ hashFiles('pubspec.lock', 'tools/source_probe/pubspec.lock', 'tool/db_codegen/pubspec.lock') }}"

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 生成本地化代码
        run: flutter gen-l10n

      - name: 校验 tag 与包版本
        run: python3 tool/release_android.py version

      - name: 校验并写入签名配置
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release_android.py signing

      - name: 构建 release APK
        run: flutter build apk --release --no-pub --target lib/main.dart

      - name: 验证 APK 签名、版本并生成校验文件
        run: python3 tool/release_android.py verify

      - name: 清理签名文件
        if: always()
        run: rm -f android/key.properties android/app/release-keystore.jks android/release-certificate.der

      - name: 保存已验证产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.ref_name }}
          path: build/release-assets/
          if-no-files-found: error
          retention-days: 14

  windows-release:
    name: Windows x64 ZIP
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}"

      - name: 检查 Windows 工具链
        run: |
          Get-Command nuget -ErrorAction Stop | Select-Object Source
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ($LASTEXITCODE -ne 0 -or !$vsVersion -or ([version]$vsVersion).Major -ne 17) {
            throw 'Windows release requires Visual Studio 2022'
          }

      - name: 校验 tag 与包版本
        run: python tool/release_android.py version

      - name: 严格安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 检查锁文件
        run: git diff --exit-code -- pubspec.lock

      - name: 构建 Windows Release
        run: flutter build windows --release --no-pub --target lib/main.dart

      - name: 校验并打包 Windows ZIP
        run: ./tool/package_windows.ps1

      - name: 保存已验证 Windows 产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ github.ref_name }}
          path: build/windows-release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布 Android 与 Windows 产物
    needs: [android-release, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-release-${{ github.ref_name }}
          path: build/release-assets/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-release-${{ github.ref_name }}
          path: build/release-assets/

      - name: 核对合并后的产物校验和
        run: |
          cd build/release-assets
          sha256sum --check SHA256SUMS.txt
          sha256sum --check SHA256SUMS-windows-x64.txt

      - name: 创建 GitHub Release 并附上产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 已有 Release 才走覆盖上传；创建失败不再被无条件 fallback 掩盖。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/release-assets/* --clobber
          else
            RELEASE_FLAGS=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then RELEASE_FLAGS+=(--prerelease); fi
            NOTES_FILE="docs/release/notes/${GITHUB_REF_NAME}.md"
            if [[ -f "$NOTES_FILE" ]]; then
              RELEASE_FLAGS+=(--notes-file "$NOTES_FILE")
            else
              RELEASE_FLAGS+=(--generate-notes)
            fi
            gh release create "$GITHUB_REF_NAME" build/release-assets/* \
              --title "$GITHUB_REF_NAME" --verify-tag "${RELEASE_FLAGS[@]}"
          fi
