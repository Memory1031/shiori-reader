name: shiori
description: "Shiori light novel reader for Android, iOS and Windows."
publish_to: 'none'
version: 1.2.0+9

environment:
  sdk: '>=3.10.3 <3.11.0'
  flutter: '>=3.38.4 <3.39.0'

dependencies:
  archive: 4.2.0
  xml: 6.6.1
  html: 0.15.7
  characters: 1.4.0
  crypto: 3.0.7
  dio: 5.11.1
  drift: 2.32.1
  sqlite3: 3.5.2
  path: 1.9.1
  file_selector: 1.1.0
  path_provider: 2.1.5
  shared_preferences: 2.5.5
  flutter:
    sdk: flutter
  get: 4.7.3
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  flutter_inappwebview: 6.1.5

dependency_overrides:
  flutter_inappwebview_windows:
    git:
      url: https://github.com/Memory1031/flutter_inappwebview.git
      ref: 3e48253e4c03beb49fe020fb1168ab1fb2be4818
      path: flutter_inappwebview_windows

dev_dependencies:
  fake_async: 1.3.3
  test: 1.26.3
  yaml: 3.1.4
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/shiori.png
    - assets/licenses/whatwg-encoding.txt
    - assets/branding/shiori-chibi-logo-v1.png
